# Despliegue como DEMO estática: sin build, sin backend (backend/ no se publica como funciones).
[build]
  publish = "."
  command = ""

# No ejecutar el install script de better-sqlite3 (no se usa en la demo).
[build.environment]
  NPM_FLAGS = "--ignore-scripts"

# No servir código del backend ni archivos internos (la demo solo usa el frontend).
[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

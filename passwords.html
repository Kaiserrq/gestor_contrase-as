<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KeyVault — Contraseñas</title>
  <meta name="description" content="Lista completa de contraseñas guardadas.">
  <meta name="theme-color" content="#08080f">
  <link rel="icon" href="/icono.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="passwords">
  <div id="page-content">
      <div class="chips" role="group" aria-label="Filtrar por categoría"></div>
      <div class="tools">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-export-txt" title="Exportar contraseñas a TXT"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Exportar TXT</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-export-pdf" title="Exportar contraseñas a PDF"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Exportar PDF</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-import" title="Importar contraseñas desde TXT"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Importar TXT</button>
      </div>
      <div class="list-head">
        <h2 id="list-title">Todas las contraseñas</h2>
        <span class="n" id="list-count">0</span>
        <span id="filter-slot"></span>
        <span class="spacer"></span>
        <div class="seg" id="view-toggle" role="group" aria-label="Vista de la lista">
          <button type="button" data-view="list" aria-pressed="true" aria-label="Vista de lista" title="Lista"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          <button type="button" data-view="grid" aria-pressed="false" aria-label="Vista de cuadrícula" title="Cuadrícula"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
        </div>
      </div>
      <div id="passwords-grid" class="pw-list" aria-live="polite"></div>
  </div>

  <script src="/js/passwords.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/io.js"></script>
  <script src="/js/categories.js"></script>
</body>
</html>

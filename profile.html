<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KeyVault — Perfil</title>
  <meta name="description" content="Gestiona tu cuenta: cambia tu nombre de usuario y contraseña.">
  <meta name="theme-color" content="#08080f">
  <link rel="icon" href="/icono.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="profile">
  <div id="page-content">
    <section class="card profile-hero">
      <div class="user-avatar" id="ph-avatar" aria-hidden="true">U</div>
      <div class="ph-info"><small>Conectado como</small><b id="badge-username">—</b></div>
      <div class="ph-actions">
        <button type="button" class="btn btn-ghost" data-logout>Cerrar sesión</button>
      </div>
    </section>

    <div class="profile-grid">
      <section class="card pcard">
        <div class="pcard-h">
          <span class="ico"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <div><b>Nombre de usuario</b><small>Cambia cómo te identificas</small></div>
        </div>
        <div class="field">
          <label for="p-newuser">Nuevo nombre de usuario</label>
          <input id="p-newuser" type="text" class="input" placeholder="mínimo 3 caracteres" autocomplete="off">
        </div>
        <div class="field">
          <label for="p-curpw-u">Contraseña actual <span class="req">*</span></label>
          <input id="p-curpw-u" type="password" class="input" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="button" class="btn btn-primary btn-block" id="btn-save-username">Guardar usuario</button>
      </section>

      <section class="card pcard">
        <div class="pcard-h">
          <span class="ico warn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <div><b>Contraseña de acceso</b><small>Actualiza tu contraseña de login</small></div>
        </div>
        <div class="field">
          <label for="p-curpw">Contraseña actual <span class="req">*</span></label>
          <input id="p-curpw" type="password" class="input" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="p-newpw">Nueva contraseña <span class="req">*</span></label>
          <input id="p-newpw" type="password" class="input" placeholder="mínimo 6 caracteres" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="p-confirmpw">Confirmar nueva contraseña <span class="req">*</span></label>
          <input id="p-confirmpw" type="password" class="input" placeholder="repite la contraseña" autocomplete="new-password">
        </div>
        <button type="button" class="btn btn-primary btn-block" id="btn-save-password">Guardar contraseña</button>
        <p class="note">Al cambiar la contraseña se cerrará la sesión automáticamente.</p>
      </section>

      <section class="card pcard hidden" id="demo-reset-box">
        <div class="pcard-h">
          <span class="ico warn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></span>
          <div><b>Modo demo</b><small>Los datos se guardan solo en tu navegador</small></div>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="btn-demo-reset">Restablecer demo</button>
      </section>
    </div>
  </div>

  <script src="/js/passwords.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/categories.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KeyVault — Panel</title>
  <meta name="description" content="Panel de seguridad de tu gestor de contraseñas.">
  <meta name="theme-color" content="#08080f">
  <link rel="icon" href="/icono.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="dashboard">
  <div id="page-content">
      <section class="dash-top">
        <article class="card health" id="health" data-tilt aria-label="Salud de seguridad"></article>
        <div class="cat-cards" id="cat-cards" aria-label="Categorías"></div>
      </section>
      <div class="chips dash-chips" role="group" aria-label="Filtrar por categoría"></div>
      <div class="list-head">
        <h2 id="list-title">Todas las contraseñas</h2>
        <span class="n" id="list-count">0</span>
        <span id="filter-slot"></span>
        <span class="spacer"></span>
        <div class="seg" id="view-toggle" role="group" aria-label="Vista de la lista">
          <button type="button" data-view="list" aria-pressed="true" aria-label="Vista de lista" title="Lista"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          <button type="button" data-view="grid" aria-pressed="false" aria-label="Vista de cuadrícula" title="Cuadrícula"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
        </div>
      </div>
      <div id="passwords-grid" class="pw-list" aria-live="polite"></div>
  </div>

  <script src="/js/passwords.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/categories.js"></script>
</body>
</html>
